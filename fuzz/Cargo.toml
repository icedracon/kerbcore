[package]
name = "kerbcore-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Own workspace so `cargo fuzz` doesn't try to pull the parent crate in as a member.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.kerbcore]
path = ".."

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
