[package]
name = "kerbcore"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Pure-Rust Kerberos wire crypto — the full AES-SHA1/SHA2 + RC4 etype matrix (RFC 3961/3962/8009/4757). ASN.1 codec + AS/TGS client to follow. No FFI, no host krb5."
keywords = ["kerberos", "rfc3961", "rfc3962", "authentication", "crypto"]
categories = ["cryptography", "authentication", "parser-implementations"]
repository = "https://github.com/icedracon/kerbcore"
readme = "README.md"

# STATUS: crypto + DER/RFC4120 codec + AS/TGS client complete; live-validated AS+TGS
# vs Server 2019/2022/2025; DER decoder fuzz-clean (71M runs). Publishing `0.1.0-alpha.1`
# (unstable API — prod after a lot more review). `publish = false` is flipped to true
# ONLY at the moment of an explicit, per-instance publish order (`--dry-run` first).
publish = false

[dependencies]
# RFC 3962 AES-CTS uses the block-level API only; CBC + CTS wrap is hand-rolled.
aes = "0.8"
hmac = "0.12"
sha1 = "0.10"
# etype 23 (RC4-HMAC): NT-hash string-to-key + HMAC-MD5. RC4 itself is hand-rolled.
md4 = "0.10"
md-5 = "0.10"
# etypes 19/20 (RFC 8009 AES-SHA2): SP800-108 KDF + HMAC-SHA-256/384.
sha2 = "0.10"

[dev-dependencies]
# Differential oracles — dev-only, NEVER runtime deps (the whole point of
# kerbcore is to remove these). ms-pac-forge validates RC4-HMAC; picky-krb (the
# library kerbcore replaces) validates the DER message codec byte-for-byte.
ms-pac-forge = "0.1.3"
picky-krb = "0.9"
picky-asn1-der = "0.5"
