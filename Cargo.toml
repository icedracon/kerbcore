[package]
name = "kerbcore"
version = "0.1.0-beta.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Pure-Rust Kerberos wire crypto — the full AES-SHA1/SHA2 + RC4 etype matrix (RFC 3961/3962/8009/4757). ASN.1 codec + AS/TGS client to follow. No FFI, no host krb5."
keywords = ["kerberos", "rfc3961", "rfc3962", "authentication", "crypto"]
categories = ["cryptography", "authentication", "parser-implementations"]
repository = "https://github.com/icedracon/kerbcore"
readme = "README.md"

# SPIKE STATUS (1.5.1): local, unpublished. `publish = false` until the ASN.1
# codec lands and the differential-vs-picky-krb migration is clean (see the
# ADhammer PLAN_KRB_CRATE.md). Name reserved on crates.io intent only — NOT
# published. Ship target when frozen: 0.1.0-beta.1.
publish = false

[dependencies]
# RFC 3962 AES-CTS uses the block-level API only; CBC + CTS wrap is hand-rolled.
aes = "0.8"
hmac = "0.12"
sha1 = "0.10"
# etype 23 (RC4-HMAC): NT-hash string-to-key + HMAC-MD5. RC4 itself is hand-rolled.
md4 = "0.10"
md-5 = "0.10"

[dev-dependencies]
# Differential oracle: kerbcore's RC4-HMAC must match our live-DC-validated
# ms-pac-forge implementation byte-for-byte. Dev-only — NEVER a runtime dep
# (the whole point of kerbcore is to remove external crypto deps).
ms-pac-forge = "0.1.3"
